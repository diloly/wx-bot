<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户维护看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  .app { display: flex; height: 100vh; background: #f5f5f5; }

  /* 左侧栏 */
  .sidebar { width: 320px; background: #2e2e2e; color: #e6e6e6; display: flex; flex-direction: column; }
  .sidebar .search { padding: 12px; }
  .sidebar .search input {
    width: 100%; padding: 7px 10px; border: none; border-radius: 4px;
    background: #424242; color: #fff; outline: none;
  }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv {
    display: flex; align-items: center; padding: 12px 14px; cursor: pointer;
    border-bottom: 1px solid #383838;
  }
  .conv:hover { background: #3a3a3a; }
  .conv.active { background: #4c4c4c; }
  .conv .avatar {
    width: 42px; height: 42px; border-radius: 5px; background: #07c160;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-right: 12px; flex-shrink: 0;
  }
  .conv .meta { flex: 1; min-width: 0; }
  .conv .name { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .preview { font-size: 12px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .badge {
    background: #fa5151; color: #fff; border-radius: 10px; font-size: 11px;
    padding: 1px 6px; margin-left: 8px; min-width: 18px; text-align: center;
  }

  /* 小toggle开关（每会话AI自动回复 / 朋友圈自动互动共用，默认关） */
  .sw { flex-shrink: 0; margin-left: 8px; cursor: pointer; }
  .sw input { display: none; }
  .sw .track {
    display: block; width: 34px; height: 20px; border-radius: 10px;
    background: #555; position: relative; transition: background .15s;
  }
  .sw .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .sw input:checked + .track { background: #07c160; }
  .sw input:checked + .track::after { left: 16px; }
  .sw input:disabled + .track { opacity: .35; }

  /* 自动回复全局状态提示条（总开关未开时提醒，解释会话开关为何不生效） */
  .ar-banner {
    display: none; background: #4a3b1a; color: #ffd161; font-size: 12px;
    line-height: 1.5; padding: 8px 14px; border-bottom: 1px solid #383838;
  }

  /* 右侧聊天 */
  .chat { flex: 1; display: flex; flex-direction: column; background: #f5f5f5; }
  .chat .header {
    height: 56px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: center; padding: 0 20px; font-size: 16px; font-weight: 500;
  }
  .chat .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.me { flex-direction: row-reverse; }
  .msg .bubble {
    max-width: 60%; padding: 9px 13px; border-radius: 6px; font-size: 14px; line-height: 1.5;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.them .bubble { background: #fff; }
  .msg.me .bubble { background: #95ec69; }
  .msg .time { font-size: 11px; color: #b0b0b0; align-self: flex-end; margin: 0 8px; }

  /* 群聊卡片的真实发送者（普通文本消息靠「昵称: 」前缀，卡片会丢，故单独渲染） */
  .bubble .msg-sender { font-size: 11px; color: #9a9a9a; margin: -2px 0 6px; }

  /* 媒体消息（图片/视频） */
  .msg .bubble.media-bubble { padding: 6px; background: #fff; }
  .msg.me .bubble.media-bubble { background: #95ec69; }
  .bubble img.media, .bubble video.media {
    display: block; max-width: 280px; max-height: 320px; border-radius: 5px; cursor: pointer;
  }
  .bubble video.media { cursor: default; }

  /* 链接/文件/小程序卡片（仿微信：标题+副题+右侧图标+底栏来源） */
  .card {
    display: block; width: 300px; background: #fff; border: 1px solid #e6e6e6;
    border-radius: 8px; overflow: hidden; text-decoration: none; color: #111;
  }
  .msg.me .card { background: #e7f9d9; border-color: #d8f0c0; }
  .card:hover { filter: brightness(0.98); }
  .card-main { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 10px; }
  .card-text { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px; line-height: 1.35; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-sub { font-size: 12px; color: #9a9a9a; margin-top: 5px; }
  .card-side { flex-shrink: 0; }
  .card img.card-thumb {
    width: 46px; height: 46px; border-radius: 6px; object-fit: cover; display: block;
  }
  .ftype {
    width: 40px; height: 40px; border-radius: 7px; color: #fff; font-size: 11px;
    font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .ftype.app { background: #07c160; font-size: 17px; }
  .card-foot {
    display: flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-top: 1px solid #f2f2f2; font-size: 11px; color: #9a9a9a;
  }
  .card-foot .card-foot-icon { font-size: 13px; line-height: 1; }

  /* ===== 朋友圈轻互动面板 ===== */
  /* 左栏顶部 tab（消息 / 朋友圈） */
  .side-tabs { display: flex; border-bottom: 1px solid #383838; }
  .side-tabs .tab {
    flex: 1; text-align: center; padding: 11px 0 9px; font-size: 13px; color: #9a9a9a;
    cursor: pointer; position: relative; user-select: none;
  }
  .side-tabs .tab.active { color: #fff; font-weight: 500; }
  .side-tabs .tab.active::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 28px; height: 2px; background: #07c160; border-radius: 1px;
  }
  .side-tabs .tab .tbadge {
    display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 5px;
    background: #fa5151; color: #fff; border-radius: 8px; font-size: 10px;
    line-height: 16px; text-align: center; vertical-align: 1px;
  }
  /* 左栏：新圈列表项 */
  .moment-item { display: flex; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #383838; }
  .moment-item:hover { background: #3a3a3a; }
  .moment-item.active { background: #4c4c4c; }
  .moment-item .m-avatar {
    width: 38px; height: 38px; border-radius: 5px; background: #fa9d3b; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    margin-right: 11px; flex-shrink: 0;
  }
  .moment-item .m-meta { flex: 1; min-width: 0; }
  .moment-item .m-name { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .moment-item .m-time { font-size: 11px; color: #777; margin-left: 6px; }
  .moment-item .m-text {
    font-size: 12px; color: #9a9a9a; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .moment-empty { padding: 40px 20px; text-align: center; color: #777; font-size: 13px; line-height: 1.8; }

  /* 右栏：自动互动管理面板（「朋友圈」页默认视图：模拟/真跑 + 按客户开关） */
  .msw-panel { max-width: 640px; margin: 0 auto; padding: 20px; }
  .msw-card { background: #2f2f2f; border: 1px solid #3d3d3d; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .msw-card h3 { font-size: 14px; color: #eee; margin: 0 0 6px; font-weight: 600; }
  .msw-title { font-size: 12px; color: #9a9a9a; margin-bottom: 10px; line-height: 1.7; }
  .msw-title b { color: #ddd; }
  .msw-sec { font-size: 12px; color: #777; padding: 6px 2px; }
  .msw-dry { display: flex; align-items: center; gap: 12px; }
  .msw-dry .msw-dry-txt { flex: 1; font-size: 12px; color: #9a9a9a; line-height: 1.7; }
  .msw-dry .msw-dry-txt b { color: #ddd; }
  .msw-row { display: flex; align-items: center; padding: 8px 0; }
  .msw-row + .msw-row { border-top: 1px solid #3d3d3d; }
  .msw-name {
    flex: 1; min-width: 0; font-size: 13px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px;
  }
  .msw-row .sw { margin-left: 10px; }
  .msw-row .sw-tag { font-size: 11px; color: #9a9a9a; margin-left: 5px; }
  /* 圈详情顶栏：返回互动管理 + 模式标签 */
  .md-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .md-mode { font-size: 11px; padding: 3px 10px; border-radius: 10px; cursor: pointer; }
  .md-mode.sim { background: #eef3ff; color: #3a5a9a; }
  .md-mode.real { background: #e8f9ee; color: #0a7a3d; }

  /* 右栏：圈详情 */
  .moment-detail { max-width: 620px; margin: 0 auto; padding: 20px; }
  .md-card { background: #fff; border-radius: 10px; padding: 18px 20px; }
  .md-head { display: flex; align-items: center; margin-bottom: 12px; }
  .md-head .md-avatar {
    width: 44px; height: 44px; border-radius: 6px; background: #fa9d3b; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 17px; margin-right: 12px;
  }
  .md-head .md-name { font-size: 15px; font-weight: 600; color: #576b95; }
  .md-head .md-time { font-size: 11px; color: #b0b0b0; margin-top: 2px; }
  .md-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .md-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .md-images.one { grid-template-columns: minmax(0, 260px); }
  .md-images img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px;
    cursor: zoom-in; background: #f0f0f0;
  }
  /* 已有评论 */
  .md-comments { margin-top: 14px; border-top: 1px solid #f2f2f2; padding-top: 10px; }
  .md-comments .mc-row { font-size: 13px; line-height: 1.6; margin-bottom: 4px; color: #333; }
  .md-comments .mc-row b { color: #576b95; font-weight: 500; }
  /* 动作按钮行 */
  .md-actions { display: flex; gap: 10px; margin-top: 16px; }
  .md-btn {
    padding: 7px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: #07c160; color: #fff;
  }
  .md-btn.ghost { background: #f2f2f2; color: #333; }
  .md-btn:disabled { opacity: .5; cursor: default; }
  /* 评论输入 */
  .md-compose { margin-top: 12px; display: none; }
  .md-compose.open { display: block; }
  .md-compose textarea {
    width: 100%; height: 68px; padding: 9px 11px; border: 1px solid #e0e0e0; border-radius: 8px;
    font-size: 13px; font-family: inherit; resize: vertical; outline: none;
  }
  .md-compose textarea:focus { border-color: #07c160; }
  .md-compose .compose-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .md-compose .compose-row .spacer { flex: 1; }
  /* 结果 toast */
  .md-toast {
    display: none; margin-top: 12px; padding: 9px 13px; border-radius: 8px;
    font-size: 12px; line-height: 1.6;
  }
  .md-toast.ok { display: block; background: #e8f9ee; color: #0a7a3d; }
  .md-toast.err { display: block; background: #fdecec; color: #c0392b; }
  .md-toast.dry { display: block; background: #fff7e0; color: #8a6d1a; }
  /* 互动通知卡 */
  .inter-card { background: #fff; border-radius: 10px; padding: 14px 20px; margin-bottom: 14px; }
  .inter-card .ic-head { display: flex; align-items: center; margin-bottom: 8px; }
  .inter-card .ic-title { font-size: 14px; font-weight: 600; flex: 1; }
  .inter-card .ic-row { font-size: 13px; color: #333; line-height: 1.7; }
  .inter-card .ic-row b { color: #576b95; font-weight: 500; }
  .inter-card .ic-row .ic-time { color: #b0b0b0; font-size: 11px; margin-left: 6px; }
  /* dry-run 提示条 */
  /* 引用回复（type 57）：引用块 + 回复正文 */
  .quote-card { width: 300px; }
  .quote-ref {
    background: #f2f2f2; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px;
    border-left: 3px solid #d2d2d2;
  }
  .msg.me .quote-ref { background: #e0f3d0; border-left-color: #bfe0a8; }
  .quote-ref .q-name { font-size: 12px; color: #576b95; margin-bottom: 3px; }
  .msg.me .quote-ref .q-name { color: #3a7a2a; }
  .quote-ref .q-text {
    font-size: 13px; color: #888; line-height: 1.4; max-height: 3.2em; overflow: hidden;
  }
  .quote-reply {
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }

  /* 视频号分享（type 51） */
  .finder-card { display: block; width: 300px; text-decoration: none; }
  .finder-cover {
    position: relative; width: 100%; height: 190px;
    background: #000 center/cover no-repeat; border-radius: 6px 6px 0 0;
  }
  .finder-cover .play-btn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,0.45);
    color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .finder-foot {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff;
    border: 1px solid #e6e6e6; border-top: none; border-radius: 0 0 8px 8px;
  }
  .msg.me .finder-foot { background: #e7f9d9; border-color: #d8f0c0; }
  .finder-foot .favatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .finder-foot .fname { font-size: 13px; color: #333; }
  .finder-foot .fauth { color: #07c160; font-size: 12px; }

  /* 文件 chip（无卡片信息时的裸文件） */
  .file-chip {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #fff;
    border: 1px solid #e8e8e8; border-radius: 6px; max-width: 280px; text-decoration: none; color: #333;
  }
  .msg.me .file-chip { background: #e7f9d9; }
  .file-chip .ficon { font-size: 22px; }
  .file-chip .fname { font-size: 13px; word-break: break-all; }
  .chat .composer {
    border-top: 1px solid #e0e0e0; padding: 12px 20px; background: #fff;
    display: flex; gap: 10px;
  }
  .chat .composer input {
    flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 4px; outline: none;
  }
  .chat .composer button {
    padding: 9px 20px; border: none; border-radius: 4px; background: #07c160; color: #fff; cursor: pointer;
  }
  .chat .composer button:disabled { background: #9ed19e; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #b0b0b0; }
  .hint { font-size: 12px; color: #999; padding: 0 20px 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="ar-banner" id="arBanner"></div>
    <div class="side-tabs">
      <div class="tab active" id="tabChat" onclick="switchTab('chat')">消息</div>
      <div class="tab" id="tabMoment" onclick="switchTab('moment')">朋友圈<span class="tbadge" id="momentBadge" style="display:none"></span></div>
    </div>
    <div id="searchWrap"><div class="search"><input id="search" placeholder="搜索会话" /></div></div>
    <div class="conv-list" id="convList"></div>
    <div class="conv-list" id="momentList" style="display:none"></div>
  </div>
  <div class="chat" id="chatPane">
    <div class="empty" id="emptyTip">从左侧选择一个会话</div>
  </div>
  <div class="chat" id="momentPane" style="display:none"></div>
</div>

<script>
const POLL = 2000;
let activeConv = null;
let lastMsgCount = 0;
let forceBottom = false;   // 刚切换会话时强制滚底一次
let renderedSigs = [];     // 当前会话已渲染消息的签名（增量渲染比对用）

async function loadConversations() {
  const res = await fetch('/api/conversations');
  const data = await res.json();
  const list = data.conversations || [];
  // 全局提示：自动回复总开关未开时，说明会话开关暂不生效
  const banner = document.getElementById('arBanner');
  if (data.auto_reply_enabled) {
    banner.style.display = 'none';
  } else {
    banner.style.display = 'block';
    banner.textContent = '自动回复总开关未开（config.json → auto_reply.enabled=false）：下面的会话开关暂不生效';
  }
  const kw = document.getElementById('search').value.trim();
  const filtered = kw ? list.filter(c => (c.name||'').includes(kw)) : list;
  const box = document.getElementById('convList');
  box.innerHTML = '';
  for (const c of filtered) {
    const div = document.createElement('div');
    div.className = 'conv' + (c.conv_id === activeConv ? ' active' : '');
    const badge = (c.unread > 0) ? `<span class="badge">${c.unread}</span>` : '';
    div.innerHTML = `
      <div class="avatar">${(c.name||'?').slice(0,1)}</div>
      <div class="meta">
        <div class="name">${esc(c.name||c.conv_id)} ${badge}</div>
        <div class="preview">${esc(c.last_msg||'')}</div>
      </div>`;
    // 每会话AI自动回复开关：默认关，只有打开才会触发ai自动回复
    const sw = document.createElement('label');
    sw.className = 'sw';
    const isGroup = String(c.conv_id).endsWith('@chatroom');
    sw.title = 'AI自动回复：' + (c.auto_reply ? '已开' : '关');
    sw.innerHTML = `<input type="checkbox" ${c.auto_reply ? 'checked' : ''}><span class="track"></span>`;
    const swInput = sw.querySelector('input');
    if (isGroup && !data.allow_groups) {
      sw.title = '群聊自动回复需先在 config.json 开 auto_reply.allow_groups';
      swInput.disabled = true;
    }
    // 拦住点击冒泡：开/关开关不算「选中会话」
    sw.onclick = (e) => e.stopPropagation();
    swInput.onchange = (e) => { e.stopPropagation(); toggleSwitch(c.conv_id, e.target.checked, sw); };
    div.appendChild(sw);
    div.onclick = () => openConv(c.conv_id, c.name);
    box.appendChild(div);
  }
}

async function toggleSwitch(convId, on, swEl) {
  try {
    await fetch('/api/switch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({conv: convId, enabled: on})
    });
    swEl.title = 'AI自动回复：' + (on ? '已开' : '关');
  } catch (err) {
    const input = swEl.querySelector('input');
    if (input) input.checked = !on;   // 失败回滚视觉状态
  }
}

async function openConv(convId, name) {
  activeConv = convId;
  lastMsgCount = 0;
  forceBottom = true;   // 切换会话：首次加载滚到最新
  renderedSigs = [];    // 重置增量渲染状态（换会话走全量重建）
  await fetch('/api/open', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({conv: convId})
  });
  renderChatHeader(name || convId);
  await loadMessages();
  loadConversations();
}

function renderChatHeader(name) {
  const pane = document.getElementById('chatPane');
  pane.innerHTML = `
    <div class="header">${esc(name)}</div>
    <div class="messages" id="messages"></div>
    <div class="hint">在此发送将调用键盘驱动真实发出（需微信在前台）。也可直接用 wechat_ui.py。</div>
    <div class="composer">
      <input id="input" placeholder="输入消息，回车发送" />
      <button id="sendBtn">发送</button>
    </div>`;
  document.getElementById('sendBtn').onclick = sendMessage;
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
}

function mediaExt(rel) {
  const m = (rel || '').match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toLowerCase() : '';
}

// 文件类型图标（仿微信：PDF红/W蓝/X绿…）
function ftypeIcon(name) {
  const ext = ((name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
  const map = {
    pdf: ['PDF', '#e64c3c'], doc: ['W', '#2b6cd4'], docx: ['W', '#2b6cd4'],
    xls: ['X', '#1e9e57'], xlsx: ['X', '#1e9e57'], csv: ['X', '#1e9e57'],
    ppt: ['P', '#d9534f'], pptx: ['P', '#d9534f'],
    zip: ['ZIP', '#c8a00a'], rar: ['RAR', '#c8a00a'], '7z': ['7Z', '#c8a00a'],
    mp3: ['MUSIC', '#7b61ff'], mp4: ['VIDEO', '#7b61ff'], mov: ['VIDEO', '#7b61ff'],
    txt: ['TXT', '#666'], md: ['MD', '#666'],
    png: ['IMG', '#0a8a0a'], jpg: ['IMG', '#0a8a0a'], jpeg: ['IMG', '#0a8a0a'],
    gif: ['GIF', '#0a8a0a'], webp: ['IMG', '#0a8a0a'],
    exe: ['EXE', '#666'], apk: ['APK', '#0a8a0a'],
  };
  const hit = map[ext.toLowerCase()];
  const [label, color] = hit || ['FILE', '#888'];
  return `<div class="ftype" style="background:${color}">${label}</div>`;
}

// 微信风格卡片：标题 + 大小/描述 + 右侧图标 + 底栏来源
function cardHtml(m) {
  let c;
  try { c = JSON.parse(m.card); } catch (e) { return esc(m.text); }
  const title = esc(c.title || '');
  const sub = esc(c.size || c.descr || '');
  const src = esc(c.source || '');

  // 引用回复（type 57）：引用块 + 回复正文
  if (c.kind === 'quote') {
    const q = c.quote || {};
    const reply = esc(c.title || m.text || '');
    const nameHtml = q.name ? `<div class="q-name">${esc(q.name)}</div>` : '';
    const qText = esc(q.text || '');
    return `<div class="quote-card">
      <div class="quote-ref">
        ${nameHtml}
        <div class="q-text">${qText || '<i style="color:#bbb">（无引用内容）</i>'}</div>
      </div>
      <div class="quote-reply">${reply}</div>
    </div>`;
  }

  // 视频号分享（type 51）：封面 + 居中播放键 + 底栏频道信息
  if (c.kind === 'finder') {
    const f = c.finder || {};
    const coverLocal = (f.cover && !f.cover.startsWith('http')) ? f.cover : '';
    const avatarLocal = (f.avatar && !f.avatar.startsWith('http')) ? f.avatar : '';
    const coverStyle = coverLocal ? `style="background-image:url('/media/${encodeURI(coverLocal)}')"` : '';
    const auth = f.auth_icon ? `<span class="fauth">✓</span>` : '';
    return `<a class="finder-card" href="${esc(f.video || c.url || '')}" target="_blank" rel="noopener">
      <div class="finder-cover" ${coverStyle}>
        <div class="play-btn">▶</div>
      </div>
      <div class="finder-foot">
        ${avatarLocal ? `<img class="favatar" src="/media/${encodeURI(avatarLocal)}" alt="">` : ''}
        <span class="fname">${esc(f.nickname || '视频号')}</span>
        ${auth}
      </div>
    </a>`;
  }

  const isFile = c.kind === 'file';
  const icon = c.thumb
    ? `<img class="card-thumb" src="/media/${encodeURI(c.thumb)}" alt="">`
    : (isFile ? ftypeIcon(c.ext || c.title) : `<div class="ftype app">${esc((c.title || '?').trim().slice(0, 1))}</div>`);
  const foot = src
    ? `<div class="card-foot"><span class="card-foot-icon">💬</span>${src}</div>`
    : '';
  if (isFile && m.media) {
    return `<a class="card" href="/media/${encodeURI(m.media)}" download>
      <div class="card-main">
        <div class="card-text">
          <div class="card-title">${title || esc(m.text)}</div>
          ${sub ? `<div class="card-sub">${sub}</div>` : ''}
        </div>
        <div class="card-side">${icon}</div>
      </div>${foot}</a>`;
  }
  if (c.url) {
    return `<a class="card" href="${esc(c.url)}" target="_blank" rel="noopener">
      <div class="card-main">
        <div class="card-text">
          <div class="card-title">${title}</div>
          ${sub ? `<div class="card-sub">${sub}</div>` : ''}
        </div>
        <div class="card-side">${icon}</div>
      </div>${foot}</a>`;
  }
  return `<div class="card">
      <div class="card-main">
        <div class="card-text">
          <div class="card-title">${title}</div>
          ${sub ? `<div class="card-sub">${sub}</div>` : ''}
        </div>
        <div class="card-side">${icon}</div>
      </div>${foot}</div>`;
}

function bubbleContent(m) {
  // 链接/文件/小程序/会议卡片
  if (m.card) {
    return cardHtml(m);
  }
  // 图片/视频/文件
  if (m.media) {
    const ext = mediaExt(m.media);
    const src = '/media/' + encodeURI(m.media);
    if (['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) {
      return `<img class="media" src="${src}" loading="lazy" onclick="window.open('${src}','_blank')">`;
    }
    if (['mp4','mov','webm'].includes(ext)) {
      return `<video class="media" controls preload="metadata" src="${src}"></video>`;
    }
    return `<a class="file-chip" href="${src}" download>
      <span class="ficon">📄</span><span class="fname">${esc(m.text || '文件')}</span></a>`;
  }
  return esc(m.text);
}

// 消息签名：内容/媒体/卡片任一变化都能被增量渲染感知
function sigOf(m) {
  return [m.role, m.ts, m.text || '', m.media || '', m.card || ''].join('\u0001');
}

// 群聊卡片的真实发送者（card.sender；普通文本消息用「昵称: 」前缀，不适用本函数）
function cardSender(m) {
  if (!m.card) return '';
  try {
    const c = JSON.parse(m.card);
    return c.sender ? `<div class="msg-sender">${esc(c.sender)}</div>` : '';
  } catch (e) { return ''; }
}

function buildMsgEl(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role === 'me' ? 'me' : 'them');
  const t = fmtTime(m.ts);
  const isMedia = m.media && !m.card;
  div.innerHTML = `<div class="bubble${isMedia ? ' media-bubble' : ''}">${cardSender(m)}${bubbleContent(m)}</div><div class="time">${t}</div>`;
  return div;
}

async function loadMessages() {
  if (!activeConv) return;
  const res = await fetch('/api/messages?conv=' + encodeURIComponent(activeConv));
  const msgs = await res.json();
  const box = document.getElementById('messages');
  if (!box) return;
  const sigs = msgs.map(sigOf);

  // ① 内容没变（绝大多数轮次）-> 一个节点都不动，用户的选择/滚动完全不受影响
  if (sigs.length === renderedSigs.length && sigs.every((s, i) => s === renderedSigs[i])) {
    return;
  }

  const stickBottom = forceBottom
    || (box.scrollHeight - box.scrollTop - box.clientHeight < 80);
  forceBottom = false;

  // ② 前缀一致、只是变长 -> 只追加新消息，旧节点原样保留（复制选中的文字不会被清掉）
  let i = 0;
  while (i < renderedSigs.length && i < sigs.length && renderedSigs[i] === sigs[i]) i++;
  if (i > 0 && i === renderedSigs.length) {
    for (; i < sigs.length; i++) {
      box.appendChild(buildMsgEl(msgs[i]));
    }
  } else {
    // ③ 内容有变/变少（如媒体回填改了旧记录）-> 全量重建，尽量保留滚动位置
    const prevScrollTop = box.scrollTop;
    box.innerHTML = '';
    for (const m of msgs) box.appendChild(buildMsgEl(m));
    if (!stickBottom) box.scrollTop = prevScrollTop;
  }

  renderedSigs = sigs;
  if (stickBottom) box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !activeConv) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({conv: activeConv, text})
    });
    const data = await res.json();
    if (!data.ok) {
      alert('发送失败：' + (data.error || '未知错误') + '\n（请确认微信在前台、且窗口未被最小化）');
    } else {
      input.value = '';
    }
  } finally {
    btn.disabled = false;
  }
  await loadMessages();
  loadConversations();
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTime(ts){
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => (n<10?'0':'')+n;
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ==================== 朋友圈轻互动 ==================== */
let activeTab = 'chat';        // 'chat' | 'moment'
let momentData = null;         // /api/moments 最近一次响应
let activeMoment = null;       // 当前打开的圈 tid
let momentView = 'panel';      // 'panel'=自动互动管理 | 'detail'=圈详情
let momentSigs = '';           // 增量渲染签名（与消息区同理，免打扰复制/滚动）

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('tabMoment').classList.toggle('active', tab === 'moment');
  document.getElementById('convList').style.display = tab === 'chat' ? '' : 'none';
  document.getElementById('momentList').style.display = tab === 'moment' ? '' : 'none';
  document.getElementById('searchWrap').style.display = tab === 'chat' ? '' : 'none';
  document.getElementById('chatPane').style.display = tab === 'chat' ? '' : 'none';
  document.getElementById('momentPane').style.display = tab === 'moment' ? '' : 'none';
  if (tab === 'moment') {
    document.getElementById('emptyTip').style.display = 'none';
    momentView = 'panel';      // 进朋友圈页默认落在「互动管理」面板
    loadMoments();
  } else {
    document.getElementById('emptyTip').style.display = activeConv ? 'none' : 'flex';
  }
}

async function loadMoments() {
  const res = await fetch('/api/moments');
  const data = await res.json();
  const sig = JSON.stringify([data.moments, data.interactions, data.unread_inter, data.dry_run, data.switches]);
  // 红点角标：两个 tab 都要更新
  const badge = document.getElementById('momentBadge');
  if (data.unread_inter > 0) {
    badge.style.display = '';
    badge.textContent = data.unread_inter > 99 ? '99+' : data.unread_inter;
  } else {
    badge.style.display = 'none';
  }
  if (activeTab !== 'moment') { momentData = data; return; }
  if (sig === momentSigs) return;          // 没变不动 DOM（不打断选择/滚动）
  momentSigs = sig;
  momentData = data;

  // 左栏：纯新圈列表（开关面板在右栏，不再塞这里）
  const box = document.getElementById('momentList');
  const ms = data.moments || [];
  if (!ms.length) {
    box.innerHTML = `<div class="moment-empty">还没有朋友圈数据。<br>
      新圈由 auto_reply.py 每约 60 秒拉取一次；<br>
      也可手动跑 <b>python moment_ops.py --poll</b> 立即拉一次。</div>`;
  } else {
    box.innerHTML = '';
    for (const m of ms) {
      const div = document.createElement('div');
      div.className = 'moment-item' + (String(m.tid) === String(activeMoment) ? ' active' : '');
      div.innerHTML = `
        <div class="m-avatar">${esc((m.nickname || '?').slice(0, 1))}</div>
        <div class="m-meta">
          <div class="m-name">${esc(m.nickname || m.username)}<span class="m-time">${fmtTime(m.create_time)}</span></div>
          <div class="m-text">${esc(m.text || '')}</div>
        </div>`;
      div.onclick = () => openMoment(m.tid);
      box.appendChild(div);
    }
  }
  // 右栏：详情视图（圈还在就继续显示，被水印挤没了就回管理面板）/ 管理面板
  if (momentView === 'detail' && activeMoment) {
    const cur = ms.find(m => String(m.tid) === String(activeMoment));
    if (cur) { renderMomentPane(data, cur); return; }
    momentView = 'panel';
  }
  renderMomentPanel(data);
}

// 右栏默认视图：自动互动管理（模拟/真跑开关 + 按客户赞/评开关，默认全关）
function renderMomentPanel(data) {
  const pane = document.getElementById('momentPane');
  const ms = data.moments || [];
  const sws = data.switches || {};
  // 客户集合 = 最近有新圈的 + 有开关记录的（开了开关的客户不会因暂无新圈从面板消失）
  const pubs = {};
  for (const m of ms) {
    const u = m.username || '';
    if (u && !pubs[u]) pubs[u] = m.nickname || u;
  }
  for (const u of Object.keys(sws)) {
    if (!pubs[u]) pubs[u] = sws[u].nickname || u;
  }
  const names = Object.keys(pubs).sort((a, b) =>
    String(pubs[a] || '').localeCompare(String(pubs[b] || ''), 'zh'));
  const dryTxt = data.dry_run
    ? `当前 <b>模拟模式（dry-run）</b>：点赞/评论只验证「能定位到目标圈」，不会真的点、真的发。<br>
       演练无误后关掉它切真跑（仍受每日 ${data.max_actions} 次上限 + 连发冷却保护）。<br>
       注意：这是朋友圈独立开关，与 auto_reply.py 的 --no-dry（消息回复）互不影响。`
    : `当前 <b>真跑模式</b>：点赞/评论会真实执行（每日上限 ${data.max_actions} 次 + 连发冷却）。<br>
       想先演练的话打开模拟开关。`;
  pane.innerHTML = `
    <div class="msw-panel">
      <div class="msw-card">
        <h3>模拟 / 真跑</h3>
        <div class="msw-dry">
          <span class="msw-dry-txt">${dryTxt}</span>
          <label class="sw" title="开=模拟（只验证定位，不真点不发）"><input type="checkbox" ${data.dry_run ? 'checked' : ''}
            onchange="setMomentDry(this.checked)"><span class="track"></span></label>
        </div>
      </div>
      <div class="msw-card">
        <h3>自动互动（按客户）</h3>
        <div class="msw-title">给客户开<b>赞</b>：他之后新发的圈自动点赞；开<b>评</b>：自动评论（文案由小光按销售人设生成）。<br>
          默认全关；只对开后<b>新到</b>的圈生效，不补赞旧圈。<b>评论不可逆，慎开。</b></div>
        ${names.length ? names.map(u => {
          const s = sws[u] || {};
          return `<div class="msw-row">
            <span class="msw-name" title="${esc(u)}">${esc(pubs[u])}</span>
            <span class="sw-tag">赞</span>
            <label class="sw" title="新圈自动点赞"><input type="checkbox" ${s.auto_like ? 'checked' : ''}
              onchange="toggleMomentSwitch(this,'${esc(u)}','like')"><span class="track"></span></label>
            <span class="sw-tag">评</span>
            <label class="sw" title="新圈自动评论（不可逆）"><input type="checkbox" ${s.auto_comment ? 'checked' : ''}
              onchange="toggleMomentSwitch(this,'${esc(u)}','comment')"><span class="track"></span></label>
          </div>`;
        }).join('') : '<div class="msw-sec">还没有可管理的客户（等有客户发了新圈，行就会出现在这里）。</div>'}
      </div>
    </div>`;
}

function showMomentPanel() {
  momentView = 'panel';
  if (momentData) renderMomentPanel(momentData);
}

async function toggleMomentSwitch(inputEl, username, field) {
  const on = inputEl.checked;
  const row = inputEl.closest('.msw-row');
  const nick = row ? ((row.querySelector('.msw-name') || {}).textContent || '').trim() : '';
  try {
    const res = await fetch('/api/moment/switch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username, field: field, enabled: on, nickname: nick})
    });
    const d = await res.json();
    if (!d.ok) { inputEl.checked = !on; showToast('err', d.error || '设置失败'); }
  } catch (e) {
    inputEl.checked = !on;
    showToast('err', '请求失败：' + e);
  }
}

function openMoment(tid) {
  activeMoment = tid;
  momentView = 'detail';
  const ms = (momentData && momentData.moments) || [];
  const cur = ms.find(m => String(m.tid) === String(tid));
  if (cur && momentData) renderMomentPane(momentData, cur);
  // 左栏高亮
  for (const el of document.querySelectorAll('.moment-item')) el.classList.remove('active');
  loadMoments();
}

function renderMomentPane(data, m) {
  const pane = document.getElementById('momentPane');
  const imgs = (m.media_json && m.media_json.images) || [];
  const localImgs = imgs.filter(i => i.local);
  const imgHtml = localImgs.length
    ? `<div class="md-images${localImgs.length === 1 ? ' one' : ''}">${
        localImgs.map(i => `<img src="/media/${encodeURI(i.local)}" loading="lazy" onclick="window.open(this.src,'_blank')">`).join('')}
      </div>`
    : (imgs.length ? `<div class="md-text" style="color:#999;font-size:12px;margin-top:8px">（含 ${imgs.length} 张图片，本地未解密成功）</div>` : '');

  // 已有评论
  const comments = (m.comments_json) || [];
  const commentsHtml = comments.length
    ? `<div class="md-comments">${comments.map(c =>
        `<div class="mc-row"><b>${esc(c.nickname || c.username || '')}</b>：${esc(c.content || '')}</div>`).join('')}</div>`
    : '';

  // 互动通知卡（有人赞/评论我）
  const inters = (data.interactions || []).filter(it => it.unread);
  const interHtml = inters.length
    ? `<div class="inter-card">
        <div class="ic-head"><span class="ic-title">互动通知（${inters.length} 条未读）</span>
          <button class="md-btn ghost" style="padding:4px 12px;font-size:12px" onclick="readInteractions()">全部已读</button>
        </div>
        ${inters.slice(0, 8).map(it =>
          `<div class="ic-row"><b>${esc(it.from_nickname || it.from_username)}</b>${
            it.type === 1 ? ' 赞了你的朋友圈' : ' 评论：' + esc(it.content || '')}
            <span class="ic-time">${fmtTime(it.create_time)}</span></div>`).join('')}
      </div>`
    : '';

  // 顶栏：返回互动管理 + 当前模式标签（点标签回面板切模拟/真跑）
  const modeChip = data.dry_run
    ? `<span class="md-mode sim" onclick="showMomentPanel()" title="点它去「互动管理」切换模拟/真跑">模拟模式</span>`
    : `<span class="md-mode real" onclick="showMomentPanel()" title="点它去「互动管理」切换模拟/真跑">真跑模式</span>`;

  pane.innerHTML = `
    <div class="moment-detail">
      <div class="md-topbar">
        <button class="md-btn ghost" onclick="showMomentPanel()">← 互动管理</button>
        ${modeChip}
      </div>
      ${interHtml}
      <div class="md-card">
        <div class="md-head">
          <div class="md-avatar">${esc((m.nickname || '?').slice(0, 1))}</div>
          <div><div class="md-name">${esc(m.nickname || m.username)}</div>
            <div class="md-time">${fmtTime(m.create_time)}</div></div>
        </div>
        <div class="md-text">${esc(m.text || '')}</div>
        ${imgHtml}
        ${commentsHtml}
        <div class="md-actions">
          <button class="md-btn" id="btnLike" onclick="momentAction('like')">👍 点赞</button>
          <button class="md-btn ghost" id="btnUnlike" onclick="momentAction('unlike')">取消</button>
          <button class="md-btn ghost" id="btnComment" onclick="toggleCompose()">💬 评论</button>
        </div>
        <div class="md-compose" id="composeBox">
          <textarea id="commentText" placeholder="评论内容（1-2句，真诚自然）"></textarea>
          <div class="compose-row">
            <button class="md-btn ghost" onclick="aiComment()">✨ AI 代写</button>
            <span class="spacer"></span>
            <button class="md-btn" id="btnSendComment" onclick="momentAction('comment')">发送评论</button>
          </div>
        </div>
        <div class="md-toast" id="mdToast"></div>
      </div>
    </div>`;
}

function showToast(kind, msg) {
  const t = document.getElementById('mdToast');
  if (!t) return;
  t.className = 'md-toast ' + kind;
  t.textContent = msg;
}

function toggleCompose() {
  const box = document.getElementById('composeBox');
  if (box) box.classList.toggle('open');
}

async function setMomentDry(dry) {
  // 复用 conv_switch 表存 dry 状态（key='__moment_dry__'），moment_ops 每轮读取
  await fetch('/api/switch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conv: '__moment_dry__', enabled: dry })
  });
  momentSigs = '';      // 强制刷新面板（dry 提示条要变）
  loadMoments();
}

async function momentAction(action) {
  if (!activeMoment) return;
  const text = action === 'comment'
    ? (document.getElementById('commentText') || {}).value || '' : '';
  if (action === 'comment' && !text.trim()) {
    showToast('err', '评论内容不能为空（可点「AI 代写」生成）');
    return;
  }
  const btns = document.querySelectorAll('.md-actions .md-btn, .md-compose .md-btn');
  btns.forEach(b => b.disabled = true);
  try {
    const res = await fetch('/api/moment/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: String(activeMoment), action, text })
    });
    const data = await res.json();
    if (!data.ok) {
      showToast('err', data.reason || data.error || '操作失败');
    } else if (data.dry) {
      showToast('dry', data.detail || data.reason);
    } else {
      showToast('ok', data.reason || '完成');
    }
  } catch (e) {
    showToast('err', '请求失败：' + e);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

async function aiComment() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '生成中...';
  try {
    const res = await fetch('/api/moment/ai-comment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tid: String(activeMoment) })
    });
    const data = await res.json();
    if (data.ok && data.text) {
      document.getElementById('commentText').value = data.text;
      showToast('ok', 'AI 文案已填入，确认后点「发送评论」');
    } else {
      showToast('err', data.reason || data.error || 'AI 生成失败');
    }
  } catch (e) {
    showToast('err', '请求失败：' + e);
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ AI 代写';
  }
}

async function readInteractions() {
  await fetch('/api/moment/inter-read', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: '{}'
  });
  momentSigs = '';
  loadMoments();
}

setInterval(() => {
  loadConversations();
  if (activeConv) loadMessages();
  loadMoments();
}, POLL);
loadConversations();
loadMoments();
</script>
